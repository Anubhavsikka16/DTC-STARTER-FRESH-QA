name: QA Automation Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-tests:

    runs-on: ubuntu-latest

    services:

        postgres:
            image: postgres:15-alpine
            env:
                POSTGRES_DB: medusa-backend
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
            ports:
            - 5432:5432
            options: >-
                --health-cmd="pg_isready -U postgres -d medusa-backend"
                --health-interval=10s
                --health-timeout=5s
                --health-retries=5

        redis:
            image: redis:7-alpine
            ports:
             - 6379:6379
            options: >-
                --health-cmd="redis-cli ping"
                --health-interval=10s
                --health-timeout=5s
                --health-retries=5

    steps:

      # --------------------------------------------------
      # 1. Checkout QA automation repository
      # --------------------------------------------------
      - name: Checkout QA repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. Checkout Medusa application repository
      # --------------------------------------------------
      - name: Checkout Medusa application
        uses: actions/checkout@v6
        with:
          repository: Anubhavsikka16/dtc-starter-clean
          path: medusa

      # --------------------------------------------------
      # 3. Setup Node.js for Medusa
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --------------------------------------------------
      # 4. Setup pnpm
      # --------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      # --------------------------------------------------
      # 5. Verify Node and pnpm
      # --------------------------------------------------
      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      # --------------------------------------------------
      # 6. Install Medusa dependencies
      # --------------------------------------------------
      - name: Install Medusa dependencies
        working-directory: medusa
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------
      # 7. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # --------------------------------------------------
      # 8. Install Poetry
      # --------------------------------------------------
      - name: Install Poetry
        run: pip install poetry

      # --------------------------------------------------
      # 9. Install QA dependencies
      # --------------------------------------------------
      - name: Install QA dependencies
        run: poetry install --no-root

      # --------------------------------------------------
      # 10. Install Playwright browsers
      # --------------------------------------------------
      - name: Install Playwright Chromium
        run: poetry run playwright install --with-deps chromium

      # --------------------------------------------------
      # 11. Run smoke tests
      # --------------------------------------------------
      - name: Run smoke tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}

          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

          BROWSER: ${{ secrets.BROWSER }}
          HEADLESS: ${{ secrets.HEADLESS }}
          SLOW_MO: ${{ secrets.SLOW_MO }}
          TIMEOUT: ${{ secrets.TIMEOUT }}

          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |
          poetry run python -m pytest -m smoke -v