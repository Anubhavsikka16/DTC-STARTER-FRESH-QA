name: QA Automation Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-tests:

    runs-on: ubuntu-latest

    services:

      # ==================================================
      # PostgreSQL
      # ==================================================
      postgres:
        image: postgres:15-alpine

        env:
          POSTGRES_DB: medusa-backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d medusa-backend"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # ==================================================
      # Redis
      # ==================================================
      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # ==================================================
      # 1. Checkout QA repository
      # ==================================================
      - name: Checkout QA repository
        uses: actions/checkout@v6

      # ==================================================
      # 2. Checkout Medusa application
      # ==================================================
      - name: Checkout Medusa application
        uses: actions/checkout@v6
        with:
          repository: Anubhavsikka16/dtc-starter-clean
          path: medusa

      # ==================================================
      # 3. Setup Node.js
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ==================================================
      # 4. Setup pnpm
      # ==================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      # ==================================================
      # 5. Verify Node and pnpm
      # ==================================================
      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      # ==================================================
      # 6. Install Medusa dependencies
      # ==================================================
      - name: Install Medusa dependencies
        working-directory: medusa
        run: |
          pnpm install --frozen-lockfile

      # ==================================================
      # 7. Create Medusa environment
      # ==================================================
      - name: Create Medusa environment
        working-directory: medusa/apps/backend
        run: |
          cat > .env <<'EOF'
          STORE_CORS=http://localhost:8000
          ADMIN_CORS=http://localhost:5173,http://localhost:9000
          AUTH_CORS=http://localhost:5173,http://localhost:9000

          REDIS_URL=redis://localhost:6379

          JWT_SECRET=ci-test-jwt-secret
          COOKIE_SECRET=ci-test-cookie-secret

          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/medusa-backend

          DB_NAME=medusa-backend
          EOF

      # ==================================================
      # 8. Run Medusa database migrations
      # ==================================================
      - name: Run Medusa migrations
        working-directory: medusa/apps/backend
        run: |
          pnpm exec medusa db:migrate

      # ==================================================
      # 9. Prepare admin credentials
      # ==================================================
      - name: Prepare CI admin credentials
        env:
          ADMIN_EMAIL_SECRET: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD_SECRET: ${{ secrets.ADMIN_PASSWORD }}

        run: |
          ADMIN_EMAIL="$(printf '%s' "$ADMIN_EMAIL_SECRET" | tr -d '\r\n')"
          ADMIN_PASSWORD="$(printf '%s' "$ADMIN_PASSWORD_SECRET" | tr -d '\r\n')"

          if [ -z "$ADMIN_EMAIL" ]; then
            echo "ERROR: ADMIN_EMAIL is empty"
            exit 1
          fi

          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "ERROR: ADMIN_PASSWORD is empty"
            exit 1
          fi

          echo "ADMIN_EMAIL=$ADMIN_EMAIL" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"

          echo "Admin email configured: true"
          echo "Admin password configured: true"
          echo "Admin email length: ${#ADMIN_EMAIL}"
          echo "Admin password length: ${#ADMIN_PASSWORD}"

      # ==================================================
      # 10. Create Medusa admin user
      # ==================================================
      - name: Create CI admin user
        working-directory: medusa/apps/backend
        run: |
          echo "Creating CI admin user..."

          echo "Admin email length: ${#ADMIN_EMAIL}"
          echo "Admin password length: ${#ADMIN_PASSWORD}"

          pnpm exec medusa user \
            --email "$ADMIN_EMAIL" \
            --password "$ADMIN_PASSWORD"

          echo "CI admin user creation completed."

      # ==================================================
      # 11. Start Medusa
      #
      # IMPORTANT:
      # Log file is outside apps/backend.
      #
      # Otherwise Medusa watcher sees medusa.log
      # changing and continuously restarts itself.
      # ==================================================
      - name: Start Medusa
        working-directory: medusa/apps/backend
        run: |
          echo "Starting Medusa..."

          pnpm dev > /tmp/medusa.log 2>&1 &

          echo $! > /tmp/medusa.pid

          echo "Medusa PID: $(cat /tmp/medusa.pid)"

      # ==================================================
      # 12. Wait for Medusa
      # ==================================================
      - name: Wait for Medusa
        run: |
          echo "Waiting for Medusa to start..."

          for i in {1..60}; do

            echo "Checking Medusa... attempt $i/60"

            if curl \
              --silent \
              --show-error \
              --fail \
              http://localhost:9000/health \
              > /dev/null; then

              echo "Medusa is ready!"
              exit 0

            fi

            if [ -f /tmp/medusa.log ]; then
              echo "----- Latest Medusa logs -----"
              tail -30 /tmp/medusa.log
            fi

            sleep 2

          done

          echo ""
          echo "=========================================="
          echo "Medusa failed to start"
          echo "=========================================="

          echo ""
          echo "========== MEDUSA LOGS =========="

          if [ -f /tmp/medusa.log ]; then
            cat /tmp/medusa.log
          else
            echo "ERROR: /tmp/medusa.log does not exist"
          fi

          echo ""
          echo "========== PORT 9000 =========="

          lsof -i :9000 || true

          exit 1

      # ==================================================
      # 13. Verify Medusa admin authentication
      #
      # This is an API-level check before Playwright.
      # ==================================================
      - name: Verify Medusa admin authentication
        env:
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}

        run: |
          echo "Testing Medusa admin authentication..."

          echo "Admin email configured: true"
          echo "Password configured: true"
          echo "Admin email length: ${#ADMIN_EMAIL}"
          echo "Admin password length: ${#ADMIN_PASSWORD}"

          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          email = os.environ["ADMIN_EMAIL"]
          password = os.environ["ADMIN_PASSWORD"]

          payload = json.dumps({
              "email": email,
              "password": password
          }).encode()

          request = urllib.request.Request(
              "http://localhost:9000/auth/user/emailpass",
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  body = response.read().decode()

                  print(f"Authentication HTTP status: {response.status}")
                  print("Authentication response:")
                  print(body)

                  if response.status != 200:
                      raise SystemExit(1)

                  print("Admin authentication successful.")

          except urllib.error.HTTPError as error:
              body = error.read().decode()

              print(f"Authentication HTTP status: {error.code}")
              print("Authentication response:")
              print(body)

              print("Admin authentication failed.")
              raise SystemExit(1)
          PY

      # ==================================================
      # 14. Setup Python
      # ==================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # ==================================================
      # 15. Install Poetry
      # ==================================================
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

          poetry --version

      # ==================================================
      # 16. Install QA dependencies
      # ==================================================
      - name: Install QA dependencies
        run: |
          poetry install --no-root

      # ==================================================
      # 17. Install Playwright
      # ==================================================
      - name: Install Playwright Chromium
        run: |
          poetry run playwright install --with-deps chromium

      # ==================================================
      # 18. Run smoke tests
      # ==================================================
      - name: Run smoke tests
        env:

          # ----------------------------------------------
          # Application
          # ----------------------------------------------
          BASE_URL: http://localhost:9000
          API_BASE_URL: http://localhost:9000

          # ----------------------------------------------
          # Admin credentials
          #
          # Same credentials used to create Medusa user.
          # ----------------------------------------------
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}

          # ----------------------------------------------
          # Browser
          # ----------------------------------------------
          BROWSER: chromium
          HEADLESS: "true"
          SLOW_MO: "0"
          TIMEOUT: "30000"

          # ----------------------------------------------
          # Database
          # ----------------------------------------------
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: medusa-backend
          DB_USER: postgres
          DB_PASSWORD: postgres

        run: |
          echo "Running smoke tests..."

          poetry run python -m pytest -m smoke -v

      # ==================================================
      # 19. Upload Medusa logs
      # ==================================================
      - name: Upload Medusa logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medusa-logs
          path: /tmp/medusa.log
          if-no-files-found: warn