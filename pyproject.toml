[project]
name = "commerceflow-qa"
version = "0.1.0"
description = "End-to-end QA automation framework using Playwright, Pytest, API, SQL, and CI/CD"
authors = [
    {name = "Anubhav Sikka"}
]

license = "MIT"
requires-python = "^3.13"
dependencies = [
    "playwright (>=1.62.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-playwright (>=0.8.0,<0.9.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "faker (>=40.36.0,<41.0.0)",
    "jsonschema (>=4.26.0,<5.0.0)",
    "allure-pytest (>=2.16.0,<3.0.0)",
    "psycopg[binary] (>=3.2,<4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
